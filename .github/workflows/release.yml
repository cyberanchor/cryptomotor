name: release

# Builds and verifies the release archives, then publishes a GitHub release with
# the archives for linux/amd64, linux/arm64 and windows/amd64, sha256sums.txt,
# release notes taken from CHANGELOG.md and signed build provenance.
#
# Triggered by pushing a tag:  git tag -a vX.Y.Z -m "cryptomotor X.Y.Z" && git push origin vX.Y.Z
# or by hand for a tag that already exists.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (vMAJOR.MINOR.PATCH)'
        required: true
        type: string

permissions:
  contents: read

env:
  # The input arrives through the environment, never through the script text,
  # so a crafted value cannot run as shell code.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the tag name
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # An exact version: the toolchain affects the digest of every binary.
          go-version: '1.27.4'
          check-latest: false
          cache: false

      - name: Confirm the tag matches the source version
        run: |
          set -euo pipefail
          src="v$(make -s version)"
          if [ "${RELEASE_TAG}" != "${src}" ]; then
            echo "tag ${RELEASE_TAG} does not match ProgramVersion ${src}" >&2
            exit 1
          fi

      - name: Formatting, vet for Linux and Windows, module checksums
        run: make check

      - name: Run all tests
        run: make test

      - name: Run tests under the race detector
        run: make race

      # A release must not ship a dependency or a Go version with a known
      # vulnerability that the code reaches.
      - name: Check dependencies and the Go version for known vulnerabilities
        run: make vulncheck

      - name: Run the end-to-end tests
        run: make e2e

      - name: Take the release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          awk -v heading="## [${RELEASE_TAG#v}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for ${RELEASE_TAG#v}" >&2
            exit 1
          fi

      - name: Build the release archives
        run: make all

      - name: Verify the archives are reproducible
        run: make verify-reproducible

      - name: Check the archive contents and self-test the linux/amd64 binary
        run: |
          set -euo pipefail
          for target in linux_amd64 linux_arm64 windows_amd64; do
            bin=cryptomotor
            [ "${target}" = windows_amd64 ] && bin=cryptomotor.exe
            listing="$(unzip -Z1 "output/cryptomotor_${RELEASE_TAG}_${target}.zip")"
            for file in "${bin}" README.md LICENSE CHANGELOG.md; do
              if ! grep -qx "${file}" <<<"${listing}"; then
                echo "cryptomotor_${RELEASE_TAG}_${target}.zip lacks ${file}" >&2
                exit 1
              fi
            done
          done
          dir="$(mktemp -d)"
          unzip -q "output/cryptomotor_${RELEASE_TAG}_linux_amd64.zip" -d "${dir}"
          "${dir}/cryptomotor" --help 2>&1 | grep -qF "${RELEASE_TAG}"
          printf 'release self-test\n' > "${dir}/plain.txt"
          "${dir}/cryptomotor" --encrypt --file "${dir}/plain.txt" --password selftest --low-memory --no-progress
          "${dir}/cryptomotor" --decrypt --file "${dir}"/encrypted/* --password selftest --no-progress
          cmp "${dir}/plain.txt" "${dir}/encrypted/decrypted/plain.txt"

      - name: Verify sha256sums.txt covers every archive
        run: |
          set -euo pipefail
          cd output
          sha256sum -c sha256sums.txt
          diff <(ls -1 | grep -vx sha256sums.txt | sort) <(awk '{print $2}' sha256sums.txt | sort)

      - name: Keep the archives for the publishing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: output/
          if-no-files-found: error

      - name: Keep the release notes for the publishing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: release-notes.md
          if-no-files-found: error

  # Only this job can write to the repository, and it runs none of the code
  # from the repository: the release notes are only read as text.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Fetch the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Fetch the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes

      - name: Sign build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          Cross-platform file encryption: XChaCha20-Poly1305 or AES-256-GCM, Argon2id, HMAC-SHA512.

          Archives for Linux x86-64, Linux ARM64 and Windows x86-64; each holds the binary,
          README.md, LICENSE and CHANGELOG.md.

          **Verify before running**
          \`\`\`bash
          sha256sum --ignore-missing -c sha256sums.txt
          gh attestation verify cryptomotor_${RELEASE_TAG}_linux_amd64.zip --repo ${GITHUB_REPOSITORY}
          \`\`\`

          Binaries are static, stripped and built with Go 1.27.4 and
          \`-trimpath -buildvcs=false -buildid=\`; \`make all\` on the tag reproduces the archives byte for byte.
          NOTES
          printf '\n## Changes in %s\n\n' "${RELEASE_TAG}" >> notes.md
          cat notes/release-notes.md >> notes.md
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "cryptomotor ${RELEASE_TAG}" \
            --notes-file notes.md
